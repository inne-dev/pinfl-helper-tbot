name: Test and Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pytest

      - name: Create data directory
        run: mkdir -p data

      - name: Run tests
        run: |
          python -m pytest test_bot.py -v

      - name: Run unit tests fallback
        if: failure()
        run: |
          python test_bot.py

      - name: Lint with pylint
        run: |
          pylint --exit-zero main.py database.py translations.py
        continue-on-error: true

      - name: Check code formatting
        run: |
          python -m py_compile main.py
          python -m py_compile database.py
          python -m py_compile translations.py
          python -m py_compile pinfl_utilities_generator.py
          python -m py_compile pinfl_utilities_parser.py

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t pinfl-helper-tbot .

      - name: Test Docker image
        run: |
          docker run --rm -e TELEGRAM_BOT_TOKEN=dummy_token pinfl-helper-tbot python -c "import main; print('Import successful')"
