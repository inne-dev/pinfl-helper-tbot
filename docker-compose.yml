services:
  pinfl-helper-tbot:
    build: .
    container_name: pinfl-helper-tbot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ISSUE_LINK=${ISSUE_LINK:-https://github.com/your-repo/issues}
    volumes:
      - ./data:/app/data
    working_dir: /app
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
